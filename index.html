<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring snabbare - km/h, Tempo & Sluttider</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
        }

        .input-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            font-size: 16px;
        }

        .input-with-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #007bff;
        }

        button.step-btn {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            width: 50px;
            height: 50px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }

        button.step-btn:hover {
            background-color: #0056b3;
        }

        .pace-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
        }

        .pace-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
        }

        .pace-inputs span {
            font-weight: bold;
            color: #666;
            font-size: 20px;
        }

        .times-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 30px;
        }

        .time-card {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .time-card-title {
            font-size: 15px;
            color: #6c757d;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .time-card-value {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Spring snabbare</h2>
        
        <!-- Input Hastighet -->
        <div class="input-group">
            <label for="kmh">Hastighet (km/h):</label>
            <div class="input-with-buttons">
                <button class="step-btn" onclick="andradKmh(-0.5)">-</button>
                <input type="number" id="kmh" placeholder="T.ex. 12" step="any" min="0.1" oninput="franKmh()">
                <button class="step-btn" onclick="andradKmh(0.5)">+</button>
            </div>
        </div>

        <!-- Input Tempo (Minuter + Sekunder) -->
        <div class="input-group">
            <label>Tempo (min/km):</label>
            <div class="input-with-buttons">
                <button class="step-btn" onclick="andradTempo(1)">-</button> <!-- Snabbare tempo = minus sekunder/minuter -->
                <div class="pace-inputs">
                    <input type="number" id="paceMin" placeholder="Min" min="0" oninput="franTempo()">
                    <span>:</span>
                    <input type="number" id="paceSek" placeholder="Sek" min="0" max="59" oninput="franTempo()">
                </div>
                <button class="step-btn" onclick="andradTempo(-1)">+</button>
            </div>
        </div>

        <!-- Sluttider -->
        <div class="times-grid">
            <div class="time-card">
                <div class="time-card-title">5 km</div>
                <div class="time-card-value" id="tid5k">--:--</div>
            </div>
            <div class="time-card">
                <div class="time-card-title">10 km</div>
                <div class="time-card-value" id="tid10k">--:--</div>
            </div>
            <div class="time-card">
                <div class="time-card-title">Halvmaraton</div>
                <div class="time-card-value" id="tidHalv">--:--</div>
            </div>
            <div class="time-card">
                <div class="time-card-title">Maraton</div>
                <div class="time-card-value" id="tidHel">--:--</div>
            </div>
        </div>
    </div>

    <script>
        // Startvärde vid laddning om man vill (lämnat tomt som tidigare)
        
        function andradKmh(val) {
            let kmhInput = document.getElementById('kmh');
            let nuvarande = parseFloat(kmhInput.value) || 10;
            let nytt = nuvarande + val;
            if (nytt < 0.5) nytt = 0.5;
            kmhInput.value = Math.round(nytt * 10) / 10;
            franKmh();
        }

        function andradTempo(sekunderVal) {
            let min = parseInt(document.getElementById('paceMin').value) || 5;
            let sek = parseInt(document.getElementById('paceSek').value) || 0;
            
            let totalt = (min * 60) + sek - sekunderVal; // Minus för att plus-knappen ska öka farten (sänka tiden per km)
            if (totalt < 30) totalt = 30;

            document.getElementById('paceMin').value = Math.floor(totalt / 60);
            document.getElementById('paceSek').value = totalt % 60;
            franTempo();
        }

        // Körs när användaren ändrar i km/h-fältet
        function franKmh() {
            const kmhVal = parseFloat(document.getElementById('kmh').value);

            if (!kmhVal || kmhVal <= 0) {
                document.getElementById('paceMin').value = "";
                document.getElementById('paceSek').value = "";
                nollstallTider();
                return;
            }

            const totalaSekunderPerKm = (3600 / kmhVal);
            const minuter = Math.floor(totalaSekunderPerKm / 60);
            const sekunder = Math.round(totalaSekunderPerKm % 60);

            if (sekunder === 60) {
                document.getElementById('paceMin').value = minuter + 1;
                document.getElementById('paceSek').value = 0;
            } else {
                document.getElementById('paceMin').value = minuter;
                document.getElementById('paceSek').value = sekunder;
            }

            uppdateraSluttider(kmhVal);
        }

        // Körs när användaren ändrar i Tempo-fälten
        function franTempo() {
            const min = parseInt(document.getElementById('paceMin').value) || 0;
            const sek = parseInt(document.getElementById('paceSek').value) || 0;

            const totalaSekunderPerKm = (min * 60) + sek;

            if (totalaSekunderPerKm <= 0) {
                document.getElementById('kmh').value = "";
                nollstallTider();
                return;
            }

            const kmh = 3600 / totalaSekunderPerKm;
            document.getElementById('kmh').value = parseFloat(kmh.toFixed(2));

            uppdateraSluttider(kmh);
        }

        function uppdateraSluttider(kmh) {
            const sekunder5k = (5 / kmh) * 3600;
            const sekunder10k = (10 / kmh) * 3600;
            const sekunderHalv = (21.0975 / kmh) * 3600;
            const sekunderHel = (42.195 / kmh) * 3600;

            document.getElementById('tid5k').textContent = formateraTid(sekunder5k);
            document.getElementById('tid10k').textContent = formateraTid(sekunder10k);
            document.getElementById('tidHalv').textContent = formateraTid(sekunderHalv);
            document.getElementById('tidHel').textContent = formateraTid(sekunderHel);
        }

        function nollstallTider() {
            document.getElementById('tid5k').textContent = "--:--";
            document.getElementById('tid10k').textContent = "--:--";
            document.getElementById('tidHalv').textContent = "--:--";
            document.getElementById('tidHel').textContent = "--:--";
        }

        function formateraTid(totalaSekunder) {
            totalaSekunder = Math.round(totalaSekunder);

            const timmar = Math.floor(totalaSekunder / 3600);
            const minuter = Math.floor((totalaSekunder % 3600) / 60);
            const sekunder = totalaSekunder % 60;

            const mStr = minuter < 10 && timmar > 0 ? '0' + minuter : minuter;
            const sStr = sekunder < 10 ? '0' + sekunder : sekunder;

            if (timmar > 0) {
                return `${timmar}:${mStr}:${sStr}`;
            } else {
                return `${minuter}:${sStr}`;
            }
        }
    </script>

</body>
</html>
